name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r manager-api/requirements.txt -r agent-fuse/requirements.txt
      - run: python -m py_compile manager-api/*.py agent-fuse/*.py kms/kms.py
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C agent-kernel
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: mkdir -p rpmbuild/SOURCES && tar czf rpmbuild/SOURCES/dxtenc-manager-0.1.0.tar.gz manager-api && tar czf rpmbuild/SOURCES/dxtenc-agent-0.1.0.tar.gz agent-fuse
      - run: rpmbuild -bb deploy/dxtenc-manager.spec --define '_topdir $(pwd)/rpmbuild'
      - run: rpmbuild -bb deploy/dxtenc-agent.spec --define '_topdir $(pwd)/rpmbuild'
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: rpmbuild/RPMS/**/*
